name: Quarto Website → GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/quarto-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Quarto installieren
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Website rendern
        run: quarto render website
      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5
      - name: Seiten hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages bereitstellen
        id: deployment
        uses: actions/deploy-pages@v4
